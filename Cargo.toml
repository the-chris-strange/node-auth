[package]
name = "node-auth"
version = "0.1.0"
edition = "2024"
description = "Authenticate Node (npm, yarn, pnpm) to Google Artifact Registry using Google Cloud ADC"
readme = "README.md"
license = "Apache-2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "node_auth"
path = "src/lib.rs"

[[bin]]
name = "node-auth"
path = "src/main.rs"

[[bin]]
name = "google-artifactregistry-auth"
path = "src/bin/google_artifactregistry_auth.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3.1"
dirs = "7.0"
gcp_auth = "0.12"
log = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.10"
