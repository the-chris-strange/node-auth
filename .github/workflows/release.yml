name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  preflight:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - id: version
        name: Verify tag and crate version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install rumdl
        uses: rvben/rumdl@v0
        with:
          version: "0.3.0"
          install-only: true
      - uses: dprint/check@v2
        with:
          dprint-version: 0.64.0
          cache: true
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo package --locked

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Create Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/node-auth" dist/package/
          cp "target/$TARGET/release/artifactregistry-auth" dist/package/
          cp "target/$TARGET/release/node-auth-token" dist/package/
          cp README.md LICENSE dist/package/
          tar -C dist/package -czf "dist/node-auth-v$VERSION-$TARGET.tar.gz" .
      - name: Create Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/$env:TARGET/release/node-auth.exe" dist/package/
          Copy-Item "target/$env:TARGET/release/artifactregistry-auth.exe" dist/package/
          Copy-Item "target/$env:TARGET/release/node-auth-token.exe" dist/package/
          Copy-Item README.md, LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/node-auth-v$env:VERSION-$env:TARGET.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/node-auth-*
          if-no-files-found: error

  publish-crate:
    name: Publish crate
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  github-release:
    name: Publish GitHub release
    needs:
      - preflight
      - build
      - publish-crate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create Homebrew archive aliases
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cp "dist/node-auth-v$VERSION-x86_64-apple-darwin.tar.gz" "dist/node-auth-$VERSION-darwin-amd64.tar.gz"
          cp "dist/node-auth-v$VERSION-aarch64-apple-darwin.tar.gz" "dist/node-auth-$VERSION-darwin-arm64.tar.gz"
          cp "dist/node-auth-v$VERSION-x86_64-unknown-linux-gnu.tar.gz" "dist/node-auth-$VERSION-linux-amd64.tar.gz"
      - name: Create checksums and package manifests
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd dist
          sha256sum node-auth-* > SHA256SUMS
          cd ..
          python3 scripts/render-package-manifests.py \
            --repository "$REPOSITORY" \
            --version "$VERSION" \
            --artifacts dist \
            --output dist/packages
      - name: Create signed Packslip manifest
        id: packslip
        uses: jdx/packslip@v1
        with:
          artifacts: dist/node-auth-v*.tar.gz dist/node-auth-v*.zip
          bin: node-auth artifactregistry-auth node-auth-token
          tag: ${{ needs.preflight.outputs.tag }}
          version: ${{ needs.preflight.outputs.version }}
          upload: "false"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PACKSLIP_BUNDLE: ${{ steps.packslip.outputs.bundle }}
        run: >-
          gh release create "$TAG" dist/node-auth-* dist/SHA256SUMS dist/packages/* "$PACKSLIP_BUNDLE"
          --verify-tag
          --generate-notes
          --title "$TAG"

  publish-homebrew:
    name: Update Homebrew tap
    needs:
      - preflight
      - github-release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Resolve Homebrew tap
        id: tap
        env:
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'the-chris-strange/homebrew-tap' }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
        run: |
          if [[ -z "$PACKAGE_TOKEN" ]]; then
            echo "::error::Set PACKAGE_REPOSITORY_TOKEN with write access to the tap and bucket."
            exit 1
          fi
          if [[ ! "$TAP_REPOSITORY" =~ ^[^/]+/homebrew-[^/]+$ ]]; then
            echo "::error::HOMEBREW_TAP_REPOSITORY must be owner/homebrew-name."
            exit 1
          fi
          echo "owner=${TAP_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TAP_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      # Homebrew Releaser always reads the latest release, including on manual runs.
      - name: Verify release is latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [[ "$latest" != "$TAG" ]]; then
            echo "::error::Homebrew Releaser requires the latest stable release ($latest); requested $TAG."
            exit 1
          fi
      - name: Publish Homebrew formula
        uses: Justintime50/homebrew-releaser@v4
        with:
          homebrew_owner: ${{ steps.tap.outputs.owner }}
          homebrew_tap: ${{ steps.tap.outputs.name }}
          github_token: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
          target_darwin_amd64: "true"
          target_darwin_arm64: "true"
          target_linux_amd64: "true"
          skip_checksum: "true"
          install: |
            bin.install "node-auth"
            bin.install "artifactregistry-auth"
            bin.install "node-auth-token"
          test: 'assert_match "Usage", shell_output("#{bin}/node-auth --help")'

  publish-scoop:
    name: Update Scoop bucket
    needs:
      - preflight
      - github-release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - name: Validate publishing token
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
        run: |
          if [[ -z "$PACKAGE_TOKEN" ]]; then
            echo "::error::Set PACKAGE_REPOSITORY_TOKEN with write access to the tap and bucket."
            exit 1
          fi
      - name: Check out Scoop bucket
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.SCOOP_BUCKET_REPOSITORY || 'the-chris-strange/scoop-bucket' }}
          token: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
          path: bucket
      - name: Create Scoop manifest directory
        run: mkdir -p bucket/bucket
      - name: Render Scoop manifest
        uses: xberg-io/actions/publish-scoop-manifests@v1
        with:
          bucket-dir: ${{ github.workspace }}/bucket
          config-file: scripts/publish/scoop.json
          tag: ${{ needs.preflight.outputs.tag }}
          version: ${{ needs.preflight.outputs.version }}
          github-repo: ${{ github.repository }}
      - name: Push manifest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd bucket
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bucket/node-auth.json
          git diff --cached --quiet || git commit -m "node-auth $VERSION"
          git push
