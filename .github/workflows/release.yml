name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  preflight:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - id: version
        name: Verify tag and crate version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo package --locked

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Create Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/node-auth" dist/package/
          cp "target/$TARGET/release/artifactregistry-auth" dist/package/
          cp README.md LICENSE dist/package/
          tar -C dist/package -czf "dist/node-auth-v$VERSION-$TARGET.tar.gz" .
      - name: Create Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/$env:TARGET/release/node-auth.exe" dist/package/
          Copy-Item "target/$env:TARGET/release/artifactregistry-auth.exe" dist/package/
          Copy-Item README.md, LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/node-auth-v$env:VERSION-$env:TARGET.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/node-auth-*
          if-no-files-found: error

  publish-crate:
    name: Publish crate
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  github-release:
    name: Publish GitHub release
    needs:
      - preflight
      - build
      - publish-crate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums and package manifests
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd dist
          sha256sum node-auth-* > SHA256SUMS
          cd ..
          python3 scripts/render-package-manifests.py \
            --repository "$REPOSITORY" \
            --version "$VERSION" \
            --artifacts dist \
            --output dist/packages
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: >-
          gh release create "$TAG" dist/node-auth-* dist/SHA256SUMS dist/packages/*
          --verify-tag
          --generate-notes
          --title "$TAG"

  publish-homebrew:
    name: Update Homebrew tap
    needs:
      - preflight
      - github-release
    if: vars.HOMEBREW_TAP_REPOSITORY != ''
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Render formula
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python3 scripts/render-package-manifests.py
          --repository "$REPOSITORY"
          --version "$VERSION"
          --artifacts dist
          --output packages
      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
          path: tap
      - name: Push formula
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p tap/Formula
          cp packages/node-auth.rb tap/Formula/node-auth.rb
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/node-auth.rb
          git diff --cached --quiet || git commit -m "node-auth $VERSION"
          git push

  publish-scoop:
    name: Update Scoop bucket
    needs:
      - preflight
      - github-release
    if: vars.SCOOP_BUCKET_REPOSITORY != ''
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Render manifest
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python3 scripts/render-package-manifests.py
          --repository "$REPOSITORY"
          --version "$VERSION"
          --artifacts dist
          --output packages
      - name: Check out Scoop bucket
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.SCOOP_BUCKET_REPOSITORY }}
          token: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
          path: bucket
      - name: Push manifest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cp packages/node-auth.json bucket/node-auth.json
          cd bucket
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add node-auth.json
          git diff --cached --quiet || git commit -m "node-auth $VERSION"
          git push
